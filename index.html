<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Entdecke die Vorzeichenregeln für Multiplikation und Division. Ein interaktiver Lernpfad für Klasse 7, 60 Minuten.">
<title>Vorzeichen verstehen · Klasse 7</title>
<style>
:root{--paper:#f7f8f3;--ink:#193c39;--muted:#59716a;--teal:#14685d;--pale:#e6f1eb;--line:#d8e2d9;--gold:#f5ce76;--white:#fff;--error:#92382a;--error-bg:#fff0ea}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ce931d;outline-offset:3px}button:disabled{cursor:default;opacity:.48}header{max-width:1200px;margin:auto;padding:28px 32px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:750;letter-spacing:-.04em;font-size:24px}.brand span{display:inline-grid;place-items:center;background:var(--teal);color:white;width:42px;height:42px;border-radius:13px;margin-right:10px;letter-spacing:0}.tag{color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:245px 1fr;gap:36px;max-width:1200px;margin:14px auto 60px;padding:0 32px}aside{padding-top:18px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:750;color:var(--teal)}h1{font-size:clamp(28px,4vw,43px);line-height:1.15;letter-spacing:-.045em;margin:12px 0 18px}h2{font-size:23px;line-height:1.3;margin:0 0 14px;letter-spacing:-.025em}h3{font-size:18px;margin:0 0 8px}p{margin:10px 0 18px}.intro{color:var(--muted);max-width:670px}.nav{display:grid;gap:6px;margin-top:22px}.nav button{border:0;background:transparent;text-align:left;color:var(--ink);border-radius:12px;padding:13px 10px;display:flex;gap:11px;align-items:center;font-size:14px}.nav button.active{background:var(--pale);font-weight:700}.nav .number{border:1px solid var(--line);border-radius:50%;width:29px;height:29px;display:grid;place-items:center;flex:none}.nav button.active .number,.nav button.done .number{background:var(--teal);border-color:var(--teal);color:white}.nav small{display:block;font-weight:400;color:var(--muted)}.track{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.track span{display:block;height:100%;background:var(--teal);transition:width .3s}.sidebar-note{font-size:13px;color:var(--muted);margin-top:28px}.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:30px;margin:24px 0;box-shadow:0 8px 24px #193c3905}.topline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}.pill{background:var(--pale);color:var(--teal);border-radius:30px;padding:5px 13px;font-size:13px;font-weight:650}.question{padding:19px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.math{font-variant-numeric:tabular-nums;font-size:21px;letter-spacing:.01em}.answer-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}.answer-row label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{width:112px;border:1px solid #a6bdb5;border-radius:9px;padding:9px 12px;color:var(--ink);background:white}textarea{width:100%;min-height:90px;border:1px solid #a6bdb5;border-radius:10px;padding:12px;resize:vertical;color:var(--ink)}select{padding:10px;max-width:100%;border:1px solid #a6bdb5;border-radius:9px;background:white;color:var(--ink)}.btn{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 17px;font-weight:650}.primary{background:var(--teal);color:white;border-color:var(--teal)}.ghost{background:transparent;border:0;font-weight:500;text-decoration:underline;text-underline-offset:4px;padding:8px 0}.feedback{font-size:15px;margin-top:10px;padding:10px 14px;border-radius:9px;background:var(--pale)}.feedback.bad{color:var(--error);background:var(--error-bg)}.feedback:empty{display:none}.hint{margin:12px 0;color:var(--muted);font-size:15px}summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.callout{background:var(--pale);padding:18px 22px;border-radius:12px;margin:18px 0}.callout.gold{background:#fff5db}.pattern{display:grid;gap:8px;margin:18px 0;max-width:340px}.pattern div{display:flex;justify-content:space-between;padding:7px 12px;background:var(--paper);border-radius:8px}.pattern .math{font-size:19px}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule-grid div{background:var(--paper);border-radius:12px;padding:16px}.checklist{list-style:none;padding:0}.checklist li{padding:8px 0}.checklist label{display:flex;align-items:start;gap:10px}.checklist input{width:20px;height:20px;margin-top:5px;flex:none}.small{font-size:14px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.end-number{font-size:50px;line-height:1.15;letter-spacing:-.04em;font-weight:750}.divider{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.reset{font-size:13px}.empty{margin:0}.teacher{margin-top:22px}.teacher table{border-collapse:collapse;width:100%;font-size:14px}.teacher td,.teacher th{padding:10px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:800px){header{padding:20px}.layout{display:block;padding:0 20px;margin-top:0}.nav{display:flex;overflow-x:auto;gap:6px;margin:10px 0 20px;padding-bottom:8px}.nav button{min-width:150px}.sidebar-note{display:none}aside{padding-top:0}.panel{padding:22px}.brand{font-size:20px}.tag{font-size:12px}.rule-grid{grid-template-columns:1fr}}@media(max-width:420px){header{align-items:start}.tag{max-width:90px;text-align:right}.layout{padding:0 14px}.panel{padding:18px;border-radius:16px}.math{font-size:19px}.btn{padding:10px 13px}}@media print{header,aside,.footer,button,.teacher{display:none}.layout{display:block;padding:0}.panel{box-shadow:none}body{background:white}}
</style>
</head>
<body>
<header><div class="brand"><span>±</span>Vorzeichen verstehen</div><div class="tag">Mathematik · Klasse 7<br>Dein Lernpfad · 60 Minuten</div></header>
<div class="layout"><aside><div class="eyebrow">Dein Weg</div><div class="track" role="progressbar" aria-label="Abgeschlossene Stationen" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><span id="bar"></span></div><div id="progress" class="small"></div><nav id="nav" class="nav" aria-label="Lernstationen"></nav><p class="sidebar-note">Erst selbst überlegen, dann prüfen. Rechne im Heft und gib die Ergebnisse hier ein. Ohne Taschenrechner.</p><button id="reset" class="btn ghost reset">Neu beginnen</button></aside><main id="main"></main></div>
<script>
(()=>{
'use strict';
const key='vorzeichen-lernreise-v1';
const titles=['Startklar?','Ein Faktor negativ','Zwei Faktoren negativ','Meine Regeln','Division entdecken','Sicher rechnen','Abschlusscheck'];
const times=[4,10,12,6,10,10,8];
let state={current:0,unlocked:0,done:[],answers:{},checks:{},notes:{},first:{},pred:null,finished:false};
try{const old=JSON.parse(localStorage.getItem(key));if(old&&old.answers&&old.checks&&Number.isInteger(old.unlocked)&&old.unlocked>=0&&old.unlocked<7)state={...state,...old,current:Math.min(old.current,old.unlocked)}}catch(e){}
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function number(v){let t=String(v).trim().replace(/\u2212/g,'-').replace(',','.').replace(/^\+\s*/, '').replace(/\s/g,'');return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t)?Number(t):null}
const specs={
 a1:[12,'Die Summe besteht aus drei gleichen Summanden.'],a2:[-6,'Addiere die drei negativen Zahlen.'],a3:[-4,'Welche Zahl ergibt mit 9 zusammen 5?'],
 b1:[-20,'Schreibe viermal (−5) als Summe und addiere.'],b2:[-18,'Schreibe dreimal (−6) als Summe.'],b3:[-18,'Vergleiche mit 3 · (−6). Die Reihenfolge der Faktoren wird vertauscht.'],
 c1:[4,'Von Zeile zu Zeile wird das Ergebnis um 4 größer. Setze dieses Muster unterhalb von 0 fort.'],c2:[8,'Setze den gleichen Abstand noch einmal fort.'],c3:[15,'Hier wächst das Ergebnis von Zeile zu Zeile um 5.'],
 d1:['negativ','Ein Faktor ist positiv, der andere negativ.'],d2:['positiv','Beide Faktoren sind negativ.'],d3:['positiv','Beide Faktoren sind positiv.'],
 e1:[-3,'Welche Zahl ergibt mit 4 multipliziert −12?'],e2:[3,'Welche Zahl ergibt mit −4 multipliziert −12?'],e3:[-3,'Welche Zahl ergibt mit −4 multipliziert 12?'],e4:['positiv','Verbinde die Division mit der passenden Multiplikation. Gleiche Vorzeichen ergeben ein positives Ergebnis.'],e5:['negativ','Verbinde die Division mit der passenden Multiplikation. Unterschiedliche Vorzeichen ergeben ein negatives Ergebnis.'],
 f1:[-42,'Verschiedene Vorzeichen: negativ. Rechne anschließend 6 · 7.'],f2:[56,'Gleiche Vorzeichen: positiv. Rechne anschließend 8 · 7.'],f3:[-8,'Verschiedene Vorzeichen: negativ. Rechne anschließend 48 : 6.'],f4:[9,'Gleiche Vorzeichen: positiv. Rechne anschließend 63 : 7.'],f5:[-6,'Unterschiedliche Vorzeichen. Rechne zuerst 2,5 · 2,4 ohne Vorzeichen.'],f6:[4,'Gleiche Vorzeichen. Multipliziere beide Zahlen mit 10, um 24 : 6 zu erhalten.'],
 g1:[36,'Prüfe die Vorzeichen beider Faktoren.'],g2:[-42,'Prüfe zuerst das Vorzeichen.'],g3:[7,'Nutze die Multiplikation als Probe.'],g4:[-8,'Nutze die Multiplikation als Probe.'],g5:[0,'Was passiert, wenn du eine Zahl mit 0 multiplizierst?'],g6:[-3,'Welche Zahl ergibt mit −8 multipliziert 24?'],bonus:[-24,'Rechne zunächst (−2) · (−3), danach das Ergebnis mal (−4).']};
function task(id,text,choices=null){const ok=state.checks[id]===true;return `<div class="question" data-task="${id}"><div class="math">${text}</div><div class="answer-row"><label for="${id}"><span class="small">${choices?'Vorzeichen':'Ergebnis'}</span>${choices?`<select id="${id}" ${ok?'disabled':''}><option value="">Bitte wählen</option>${choices.map(c=>`<option ${state.answers[id]===c?'selected':''}>${c}</option>`).join('')}</select>`:`<input id="${id}" type="text" inputmode="decimal" autocomplete="off" aria-label="Ergebnis zu ${esc(text.replace(/<[^>]+>/g,''))}" value="${esc(state.answers[id])}" ${ok?'disabled':''}>`}</label><button class="btn ${ok?'':'primary'}" data-check="${id}" ${ok?'disabled':''}>${ok?'✓ Geprüft':'Prüfen'}</button></div><div class="feedback ${state.checks[id]===false?'bad':''}" id="feedback-${id}" aria-live="polite">${ok?'Richtig.':state.checks[id]===false?'Noch nicht richtig. Prüfe deine Rechnung und versuche es erneut.':''}</div><details class="hint"><summary>Ein Tipp, bitte</summary><p>${specs[id][1]}</p></details></div>`}
function note(id,prompt,model){const done=state.checks[id]===true;return `<div class="question"><h3>${prompt}</h3><label class="sr-only" for="${id}">Deine Begründung</label><textarea id="${id}" placeholder="Beschreibe deine Beobachtung in eigenen Worten.">${esc(state.notes[id])}</textarea><button class="btn" data-note="${id}">Mit einer möglichen Erklärung vergleichen</button><div id="feedback-${id}" class="feedback" aria-live="polite"></div><div id="model-${id}" class="callout" ${done?'':'hidden'}><strong>Mögliche Erklärung</strong><p>${model}</p><p class="small">Dein Text wird nicht automatisch bewertet. Vergleiche die Gedanken, nicht den genauen Wortlaut.</p><label><input type="checkbox" style="width:20px" data-reflect="${id}" ${done?'checked':''}> Ich habe meine Erklärung verglichen und bei Bedarf verbessert.</label></div></div>`}
const requirements=[['a1','a2','a3','prediction'],['b1','b2','b3','bn'],['c1','c2','c3','cn'],['d1','d2','d3','dn'],['e1','e2','e3','e4','e5'],['f1','f2','f3','f4','f5','f6','fn'],['g1','g2','g3','g4','g5','g6','gn']];
function ready(){return requirements[state.current].every(id=>state.checks[id]===true)}
function content(i){switch(i){
case 0:return `<p class="intro">Du kannst bereits negative Zahlen addieren und subtrahieren. Heute findest du heraus, wie Multiplikation und Division funktionieren.</p><div class="callout gold"><strong>Die Frage für heute</strong><p class="math">(−4) · (−3) = ?</p><p>Ist das Ergebnis positiv oder negativ? Gib zuerst eine Vermutung ab. Am Ende löst du das Rätsel.</p><div class="actions">${['positiv','negativ','weiß ich noch nicht'].map(p=>`<button class="btn" data-predict="${p}" aria-pressed="${state.pred===p}">${p}</button>`).join('')}</div><p id="prediction-feedback" class="small">${state.pred?'Vermutung gespeichert. Die Auflösung kommt später.':''}</p></div><div class="panel"><h2>Kurzer Rückblick</h2>${task('a1','4 + 4 + 4 = ?')}${task('a2','(−2) + (−2) + (−2) = ?')}${task('a3','5 − 9 = ?')}</div><p class="small">Arbeite allein. Nutze ein Heft für Rechenwege und Erklärungen. Eine Station wird freigeschaltet, wenn du die Aufgaben geprüft hast.</p>`;
case 1:return `<p class="intro">Multiplikation kennst du als wiederholte Addition. Kannst du diesen Gedanken auch bei negativen Summanden nutzen?</p><div class="panel"><h2>Von der Summe zum Produkt</h2><p>Schreibe die ersten beiden Produkte als Summe ins Heft. Berechne dann das Ergebnis.</p>${task('b1','4 · (−5) = ?')}${task('b2','3 · (−6) = ?')}<p>Bei positiven Zahlen darfst du die Faktoren vertauschen. Übertrage diese Idee auf die nächste Rechnung.</p>${task('b3','(−6) · 3 = ?')}${note('bn','Was fällt dir am Vorzeichen auf?','Wird eine negative Zahl mehrfach addiert, entsteht wieder eine negative Zahl. Beim Vertauschen der Faktoren bleibt das Ergebnis gleich. Ein positiver und ein negativer Faktor ergeben deshalb ein negatives Produkt.')}</div>`;
case 2:return `<p class="intro">Was passiert, wenn beide Faktoren negativ sind? Setze die Rechenmuster so fort, dass sich der Abstand zwischen den Ergebnissen nicht ändert.</p><div class="panel"><h2>Ein Muster über die Null hinaus</h2><div class="pattern">${[['3','−12'],['2','−8'],['1','−4'],['0','0']].map(r=>`<div class="math"><span>${r[0]} · (−4)</span><span>= ${r[1]}</span></div>`).join('')}</div><p>Der erste Faktor wird jeweils um 1 kleiner. Um wie viel verändert sich das Ergebnis? Notiere deine Beobachtung und ergänze.</p>${task('c1','(−1) · (−4) = ?')}${task('c2','(−2) · (−4) = ?')}<hr class="divider"><h3>Prüfe deine Idee an einem zweiten Muster</h3><div class="pattern">${[['2','−10'],['1','−5'],['0','0']].map(r=>`<div class="math"><span>${r[0]} · (−5)</span><span>= ${r[1]}</span></div>`).join('')}</div><p>Führe das Muster im Heft bis zum ersten Faktor −3 fort.</p>${task('c3','(−3) · (−5) = ?')}${note('cn','Warum passt dein Ergebnis zum Muster?','Im ersten Muster wächst das Ergebnis bei jedem Schritt um 4: nach 0 folgen 4 und 8. Im zweiten wächst es um 5: nach 0 folgen 5, 10 und 15. Wenn wir das Muster beibehalten, muss das Produkt zweier negativer Zahlen positiv sein.')}</div>`;
case 3:return `<p class="intro">Formuliere aus deinen Beobachtungen die Vorzeichenregeln. Hier geht es zunächst nur um das Vorzeichen, nicht um den Wert.</p><div class="panel"><h2>Meine Vorzeichenregeln</h2>${task('d1','positiv · negativ → ?', ['positiv','negativ'])}${task('d2','negativ · negativ → ?', ['positiv','negativ'])}${task('d3','positiv · positiv → ?', ['positiv','negativ'])}${note('dn','Fasse die Regeln in zwei Sätzen zusammen.','Zwei Zahlen mit gleichen Vorzeichen ergeben ein positives Produkt. Zwei Zahlen mit unterschiedlichen Vorzeichen ergeben ein negatives Produkt. Ist ein Faktor 0, ist das Produkt 0; das Ergebnis ist dann weder positiv noch negativ.')}</div><div class="callout gold"><strong>Sicherung im Heft</strong><p>Schreibe deine beiden Regeln mit je einem eigenen Beispiel auf. Ergänze den Sonderfall mit 0.</p></div>`;
case 4:return `<p class="intro">Division ist die Umkehrung der Multiplikation. Nutze das, um die Vorzeichen beim Dividieren selbst herauszufinden.</p><div class="panel"><h2>Welche Zahl fehlt?</h2><p>Suche jeweils die Zahl im Kästchen. Notiere beide Rechnungen ins Heft.</p>${task('e1','4 · □ = −12 &nbsp; ⇒ &nbsp; (−12) : 4 = □')}${task('e2','(−4) · □ = −12 &nbsp; ⇒ &nbsp; (−12) : (−4) = □')}${task('e3','(−4) · □ = 12 &nbsp; ⇒ &nbsp; 12 : (−4) = □')}<hr class="divider"><h3>Leite die Regel für die Division ab.</h3>${task('e4','gleiche Vorzeichen → ?', ['positiv','negativ'])}${task('e5','unterschiedliche Vorzeichen → ?', ['positiv','negativ'])}<div class="callout"><strong>Notiere im Heft</strong><p>Formuliere die beiden Regeln für die Division und ergänze je ein Beispiel aus dieser Station.</p><p class="small">Durch 0 darfst du nicht dividieren. 0 geteilt durch eine Zahl ungleich 0 ergibt 0.</p></div></div>`;
case 5:return `<p class="intro">Bestimme zuerst das Vorzeichen. Berechne dann den Wert. Wenn du einen Rechenweg aufschreibst: pro Zeile nur ein Rechenschritt.</p><div class="panel"><h2>Vom Vorzeichen zum Ergebnis</h2>${task('f1','(−6) · 7 = ?')}${task('f2','(−8) · (−7) = ?')}${task('f3','48 : (−6) = ?')}${task('f4','(−63) : (−7) = ?')}<h3>Die Regeln gelten auch bei Dezimalzahlen.</h3>${task('f5','(−2,5) · 2,4 = ?')}${task('f6','(−2,4) : (−0,6) = ?')}${note('fn','Finde den Fehler: (−5) · (−3) = −15','Der Wert 15 ist richtig, das Vorzeichen ist falsch. Beide Faktoren sind negativ und haben damit gleiche Vorzeichen. Das Produkt ist positiv: (−5) · (−3) = 15.')}</div><p class="small">Falls dich die Dezimalrechnung aufhält: Nutze den Tipp. Entscheidend ist heute, dass du die Vorzeichen sicher bestimmen kannst.</p>`;
case 6:return `<p class="intro">Bearbeite diesen Check zunächst ohne Tipps. Du kannst Fehler anschließend verbessern. Dein erster Versuch bleibt für die Auswertung gespeichert.</p><div class="panel"><h2>Was kannst du jetzt?</h2>${task('g1','(−9) · (−4) = ?')}${task('g2','6 · (−7) = ?')}${task('g3','(−56) : (−8) = ?')}${task('g4','64 : (−8) = ?')}${task('g5','0 · (−12) = ?')}${task('g6','(−8) · □ = 24')}${note('gn','Zurück zum Starträtsel: Begründe das Vorzeichen von (−4) · (−3).','Beide Faktoren sind negativ. Sie haben gleiche Vorzeichen, deshalb ist das Produkt positiv. Der Wert ist 12: (−4) · (−3) = 12.')}</div>`;
}}
function render(){const i=state.current;$('#bar').style.width=state.done.length/7*100+'%';$('.track').setAttribute('aria-valuenow',state.done.length);$('#progress').textContent=state.done.length+' von 7 Stationen abgeschlossen';$('#nav').innerHTML=titles.map((t,j)=>`<button data-go="${j}" class="${i===j?'active ':''}${state.done.includes(j)?'done':''}" ${j>state.unlocked?'disabled':''} ${i===j?'aria-current="step"':''}><span class="number">${state.done.includes(j)?'✓':j+1}</span><span>${t}<small>${times[j]} Minuten${j>state.unlocked?' · gesperrt':''}</small></span></button>`).join('');$('#main').innerHTML=`<div class="topline"><span class="eyebrow">Station ${i+1} / 7</span><span class="pill">ca. ${times[i]} Minuten</span></div><h1>${titles[i]}</h1>${content(i)}<div class="footer"><span id="gate" class="small">${ready()?'Alles geprüft. Du kannst weitergehen.':'Prüfe alle Aufgaben und vergleiche deine Erklärung.'}</span><button id="next" class="btn primary" ${ready()?'':'disabled'}>${i===6?'Lernpfad abschließen':'Weiter zur nächsten Station →'}</button></div>${state.finished&&i===6?finish():''}${i===0?teacher():''}`;bind();}
function updateGate(){const good=ready();$('#next').disabled=!good;$('#gate').textContent=good?'Alles geprüft. Du kannst weitergehen.':'Prüfe alle Aufgaben und vergleiche deine Erklärung.'}
function finish(){const ids=requirements[6].filter(x=>x!=='gn'),score=ids.filter(id=>state.first[id]===true).length;const mult=ids.filter(id=>['g1','g2','g5'].includes(id)&&state.first[id]===false);const div=ids.filter(id=>['g3','g4','g6'].includes(id)&&state.first[id]===false);return `<section id="result" class="panel"><div class="eyebrow">Dein Lernpfad ist abgeschlossen</div><h2>Vorzeichen verstanden!</h2><div class="end-number">${score} / 6</div><p>Ergebnisse waren im ersten Versuch richtig. Inzwischen hast du alle Aufgaben verbessert.</p><div class="callout"><strong>Dein nächster Schritt</strong><p>${mult.length?'Übe die Multiplikation noch einmal mit Station 2 und 3. ':''}${div.length?'Übe die Division noch einmal mit Station 5. ':''}${!mult.length&&!div.length?'Du rechnest bereits sicher. Probiere die Zusatzaufgabe unten.':''}</p></div><h3>Merksätze zum Mitnehmen</h3><div class="rule-grid"><div><strong>Gleiche Vorzeichen</strong><p>Produkt oder Quotient positiv.</p></div><div><strong>Unterschiedliche Vorzeichen</strong><p>Produkt oder Quotient negativ.</p></div></div><p class="small">Sonderfälle: Ein Faktor 0 → Produkt 0. Durch 0 darfst du nicht teilen.</p><h3>Zusatz für Schnelle · mehrere Faktoren</h3><p>Rechne schrittweise. Wie oft ändert sich das Vorzeichen?</p>${task('bonus','(−2) · (−3) · (−4) = ?')}<button id="print" class="btn">Ergebnis drucken / als PDF speichern</button></section>`}
function teacher(){return `<details class="teacher"><summary>Hinweise für die Lehrkraft</summary><div class="panel"><h2>60 Minuten · selbstständig</h2><p>Die Zeitangaben sind Richtwerte. Die Vorzeichenregeln werden entdeckt, bevor die Sicherung sichtbar wird. Freitexte werden mit Mustererklärungen selbst verglichen. Numerische Eingaben und Vorzeichen werden automatisch geprüft.</p><table><thead><tr><th>Phase</th><th>Minuten</th></tr></thead><tbody>${titles.map((t,i)=>`<tr><td>${i+1}. ${t}</td><td>${times[i]}</td></tr>`).join('')}</tbody></table><p>Orientiert an den abgebildeten Buchseiten 26–30. Schwerpunkt der Erstbegegnung: Vorzeichen bei Multiplikation und Division, danach zwei Dezimalaufgaben. Brüche, Potenzen und umfangreiches geschicktes Rechnen gehören in die Folgestunden.</p><p>Bei freier Begründung zählt der mathematische Gedanke. Die Lehrkraft sollte diese Erklärungen stichprobenartig besprechen. Korrekturen im Abschlusscheck bleiben möglich; die Auswertung bezieht sich auf den ersten Prüfversuch.</p><p>Fortschritt bleibt, soweit der Browser es zulässt, auf diesem Gerät gespeichert. Es werden keine Namen und keine Antworten an die Lehrkraft übermittelt. Für eine Rückmeldung können die Kinder das Ergebnis zeigen oder speichern.</p><p>Das Buch sollte während der Entdeckung auf S. 26–27 geschlossen bleiben. Diese Seiten können im Anschluss zur Wiederholung gelesen werden.</p></div></details>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.go);save();render();$('#main').scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-predict]').forEach(b=>b.onclick=()=>{state.pred=b.dataset.predict;state.checks.prediction=true;save();render()});document.querySelectorAll('[data-task] input,[data-task] select').forEach(el=>{el.oninput=()=>{state.answers[el.id]=el.value;save()};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector(`[data-check="${el.id}"]`).click()}}});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const id=b.dataset.check,el=document.getElementById(id),value=el.value,target=specs[id][0];state.answers[id]=value;const fb=document.getElementById('feedback-'+id);if(!value.trim()){fb.className='feedback bad';fb.textContent='Gib zuerst ein Ergebnis ein.';return}const parsed=typeof target==='number'?number(value):value;if(parsed===null){fb.className='feedback bad';fb.textContent='Gib eine Zahl ein, zum Beispiel −12 oder 2,4.';return}const ok=parsed===target;if(!(id in state.first))state.first[id]=ok;state.checks[id]=ok;fb.className='feedback'+(ok?'':' bad');fb.textContent=ok?'Richtig.':`Noch nicht richtig. ${specs[id][1]} Versuche es erneut.`;if(ok){el.disabled=true;b.disabled=true;b.textContent='✓ Geprüft';b.classList.remove('primary')}save();updateGate()});document.querySelectorAll('textarea').forEach(el=>el.oninput=()=>{state.notes[el.id]=el.value;save()});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const id=b.dataset.note,txt=document.getElementById(id).value.trim(),fb=document.getElementById('feedback-'+id);if(!requirements[state.current].filter(x=>x!==id).every(x=>state.checks[x]===true)){fb.className='feedback bad';fb.textContent='Prüfe zuerst die Rechenaufgaben dieser Station. Vergleiche danach deine Erklärung.';return}if(txt.length<12){fb.className='feedback bad';fb.textContent='Beschreibe zuerst deinen Gedanken in einem kurzen Satz.';return}state.notes[id]=txt;document.getElementById('model-'+id).hidden=false;fb.textContent='Vergleiche deine Erklärung. Passt dein Gedanke? Verbessere ihn bei Bedarf und setze anschließend das Häkchen.';fb.className='feedback';save()});document.querySelectorAll('[data-reflect]').forEach(c=>c.onchange=()=>{state.checks[c.dataset.reflect]=c.checked;save();updateGate()});$('#next').onclick=()=>{if(!ready())return;const i=state.current;if(!state.done.includes(i))state.done.push(i);if(i<6){state.unlocked=Math.max(state.unlocked,i+1);state.current=i+1}else state.finished=true;save();render();(i===6?$('#result'):$('#main')).scrollIntoView({behavior:'smooth',block:'start'})};if($('#print'))$('#print').onclick=()=>window.print()}
$('#reset').onclick=()=>{if(confirm('Alle Eingaben und Fortschritte auf diesem Gerät löschen und neu beginnen?')){state={current:0,unlocked:0,done:[],answers:{},checks:{},notes:{},first:{},pred:null,finished:false};save();render()}};render();
})();
</script>
</body>
</html>
